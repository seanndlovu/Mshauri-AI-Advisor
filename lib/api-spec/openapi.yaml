openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Mhauri AI Agriculture Assistant API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: chat
    description: Chat and conversation operations
  - name: knowledge
    description: Knowledge base article operations
  - name: farmers
    description: Farmer profile operations
  - name: market
    description: Zimbabwe commodity market prices
  - name: broadcasts
    description: WhatsApp broadcast messages
  - name: analytics
    description: Usage analytics
  - name: contacts
    description: Contact management (emails & WhatsApp)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /chat/conversations:
    get:
      operationId: listConversations
      tags: [chat]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
    post:
      operationId: createConversation
      tags: [chat]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"

  /chat/conversations/{id}:
    delete:
      operationId: deleteConversation
      tags: [chat]
      summary: Delete a conversation and its messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted successfully

  /chat/conversations/{id}/messages:
    get:
      operationId: getConversationMessages
      tags: [chat]
      summary: Get all messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"

  /knowledge/articles:
    get:
      operationId: listArticles
      tags: [knowledge]
      summary: List all knowledge base articles
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: language
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Article"
    post:
      operationId: createArticle
      tags: [knowledge]
      summary: Create a knowledge base article
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleInput"
      responses:
        "201":
          description: Created article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"

  /knowledge/articles/{id}:
    get:
      operationId: getArticle
      tags: [knowledge]
      summary: Get a single article
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "404":
          description: Not found
    patch:
      operationId: updateArticle
      tags: [knowledge]
      summary: Update an article
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleUpdate"
      responses:
        "200":
          description: Updated article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
    delete:
      operationId: deleteArticle
      tags: [knowledge]
      summary: Delete an article
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /knowledge/categories:
    get:
      operationId: listCategories
      tags: [knowledge]
      summary: List all distinct categories
      responses:
        "200":
          description: List of category strings
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /farmers:
    get:
      operationId: listFarmers
      tags: [farmers]
      summary: List all registered farmers
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: isActive
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: List of farmers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Farmer"

  /farmers/{phone}:
    get:
      operationId: getFarmer
      tags: [farmers]
      summary: Get a farmer by phone number
      parameters:
        - name: phone
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Farmer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Farmer"
        "404":
          description: Not found
    patch:
      operationId: updateFarmer
      tags: [farmers]
      summary: Update a farmer profile
      parameters:
        - name: phone
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FarmerUpdate"
      responses:
        "200":
          description: Updated farmer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Farmer"
        "404":
          description: Not found
    delete:
      operationId: deleteFarmer
      tags: [farmers]
      summary: Delete a farmer record
      parameters:
        - name: phone
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /market-prices:
    get:
      operationId: listMarketPrices
      tags: [market]
      summary: List commodity prices
      parameters:
        - name: commodity
          in: query
          required: false
          schema:
            type: string
        - name: market
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of market prices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketPrice"
    post:
      operationId: createMarketPrice
      tags: [market]
      summary: Add a commodity price entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketPriceInput"
      responses:
        "201":
          description: Created price entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketPrice"

  /market-prices/{id}:
    patch:
      operationId: updateMarketPrice
      tags: [market]
      summary: Update a price entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketPriceInput"
      responses:
        "200":
          description: Updated price entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketPrice"
    delete:
      operationId: deleteMarketPrice
      tags: [market]
      summary: Delete a price entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /broadcasts:
    get:
      operationId: listBroadcasts
      tags: [broadcasts]
      summary: List all broadcasts
      responses:
        "200":
          description: List of broadcasts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Broadcast"
    post:
      operationId: sendBroadcast
      tags: [broadcasts]
      summary: Send a broadcast message to all active farmers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BroadcastInput"
      responses:
        "201":
          description: Broadcast queued and sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Broadcast"

  /analytics/summary:
    get:
      operationId: getAnalyticsSummary
      tags: [analytics]
      summary: Get analytics overview
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            default: 30
      responses:
        "200":
          description: Analytics summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsSummary"


  /contacts:
    get:
      operationId: listContacts
      tags: [contacts]
      summary: List all contacts (anonymised)
      responses:
        "200":
          description: List of contacts with anonymised values
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contact"

  /contacts/email:
    post:
      operationId: addEmailContact
      tags: [contacts]
      summary: Register an email contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddEmailContactInput"
      responses:
        "201":
          description: Contact created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /contacts/whatsapp:
    post:
      operationId: addWhatsappContact
      tags: [contacts]
      summary: Register a WhatsApp phone contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddWhatsappContactInput"
      responses:
        "201":
          description: Contact created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "409":
          description: Phone already registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    Conversation:
      type: object
      required: [id, title, createdAt, updatedAt, messageCount]
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
        messageCount:
          type: integer

    ConversationInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1

    Message:
      type: object
      required: [id, conversationId, role, content, createdAt]
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        imageUrl:
          type: ["string", "null"]
        createdAt:
          type: string

    Article:
      type: object
      required: [id, title, content, category, tags, language, isActive, createdAt, updatedAt]
      properties:
        id:
          type: integer
        title:
          type: string
        content:
          type: string
        category:
          type: string
        tags:
          type: array
          items:
            type: string
        language:
          type: string
          enum: [en, sn, nd, all]
        isActive:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string

    ArticleInput:
      type: object
      required: [title, content, category]
      properties:
        title:
          type: string
          minLength: 1
        content:
          type: string
          minLength: 1
        category:
          type: string
          minLength: 1
        tags:
          type: array
          items:
            type: string
        language:
          type: string
          enum: [en, sn, nd, all]
        isActive:
          type: boolean

    ArticleUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        content:
          type: string
        category:
          type: string
        tags:
          type: array
          items:
            type: string
        language:
          type: string
          enum: [en, sn, nd, all]
        isActive:
          type: boolean

    Farmer:
      type: object
      required: [phone, crops, livestock, languagePref, isActive, lastSeen, createdAt, updatedAt]
      properties:
        phone:
          type: string
        name:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        crops:
          type: array
          items:
            type: string
        livestock:
          type: array
          items:
            type: string
        languagePref:
          type: string
          enum: [en, sn, nd]
        isActive:
          type: boolean
        lastSeen:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string

    FarmerUpdate:
      type: object
      properties:
        name:
          type: string
        location:
          type: string
        crops:
          type: array
          items:
            type: string
        livestock:
          type: array
          items:
            type: string
        languagePref:
          type: string
          enum: [en, sn, nd]
        isActive:
          type: boolean

    MarketPrice:
      type: object
      required: [id, commodity, unit, priceUsd, market, priceDate, createdAt, updatedAt]
      properties:
        id:
          type: integer
        commodity:
          type: string
        unit:
          type: string
        priceUsd:
          type: string
        market:
          type: string
        priceDate:
          type: string
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    MarketPriceInput:
      type: object
      required: [commodity, priceUsd, priceDate]
      properties:
        commodity:
          type: string
          minLength: 1
        unit:
          type: string
        priceUsd:
          type: string
        market:
          type: string
        priceDate:
          type: string
        notes:
          type: string

    Broadcast:
      type: object
      required: [id, message, status, recipientCount, createdAt]
      properties:
        id:
          type: integer
        message:
          type: string
        status:
          type: string
          enum: [draft, sending, sent, failed]
        recipientCount:
          type: integer
        sentAt:
          type: ["string", "null"]
        createdAt:
          type: string

    BroadcastInput:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1

    AnalyticsSummary:
      type: object
      required: [totalMessages, totalFarmers, languageBreakdown, messagesPerDay, topEventTypes]
      properties:
        totalMessages:
          type: integer
        totalFarmers:
          type: integer
        languageBreakdown:
          type: object
          additionalProperties:
            type: integer
        messagesPerDay:
          type: array
          items:
            type: object
            required: [date, count]
            properties:
              date:
                type: string
              count:
                type: integer
        topEventTypes:
          type: array
          items:
            type: object
            required: [eventType, count]
            properties:
              eventType:
                type: string
              count:
                type: integer
    Contact:
      type: object
      required: [type, display, createdAt]
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [whatsapp, email]
        display:
          type: string
          description: Anonymised display value
        label:
          type: string
        source:
          type: string
        createdAt:
          type: string
          format: date-time

    AddEmailContactInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
        label:
          type: string

    AddWhatsappContactInput:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
        label:
          type: string
